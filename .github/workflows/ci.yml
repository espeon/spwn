name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo check
        run: cargo check --workspace

      - name: cargo clippy
        run: cargo clippy --workspace

      - name: cargo test (unit)
        run: cargo test --workspace --lib

      - name: cargo test (integration)
        run: cargo test --workspace --test '*'
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          TESTCONTAINERS_RYUK_DISABLED: "true"

  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/go.mod
          cache-dependency-path: services/go.sum

      - name: go build
        working-directory: services
        run: go build ./...

      - name: go vet
        working-directory: services
        run: go vet ./...

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: install deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: lint
        working-directory: frontend
        run: pnpm lint

      - name: build
        working-directory: frontend
        run: pnpm build

  publish:
    name: publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [rust, go, frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: spwn-control-plane
            dockerfile: docker/control-plane.Dockerfile
          - image: spwn-ssh-gateway
            dockerfile: docker/ssh-gateway.Dockerfile
          - image: spwn-caddy
            dockerfile: docker/caddy.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  publish-host-agent:
    name: publish host-agent
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [rust]
    steps:
      - uses: actions/checkout@v4

      - name: install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: build host-agent
        run: cargo build --release -p host-agent

      - name: upload host-agent
        uses: actions/upload-artifact@v4
        with:
          name: spwn-host-agent
          retention-days: 30
          path: target/release/host-agent
